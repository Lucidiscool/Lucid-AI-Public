name: Deploy Lucid website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public interface
        run: |
          mkdir _site
          cp website/* _site/
          sed -i 's|<head>|<head><script>window.LUCID_STATIC_PREVIEW=true;</script>|' _site/index.html
          touch _site/.nojekyll
          node --check _site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
